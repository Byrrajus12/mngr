[package]
name = "mngr"
version = "0.1.0"
description = "Real-time monitor and control panel for AI coding agents"
authors = ["mngr"]
edition = "2021"

[lib]
name = "mngr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tauri = { version = "2.11.5", features = [] }
thiserror = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.5"
windows = { version = "0.48", features = ["Win32_Foundation"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
